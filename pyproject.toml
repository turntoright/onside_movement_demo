[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onside-movement-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40",
  "tzdata>=2026.1",
  "duckdb>=1.5,<1.6",
  "dbt-duckdb~=1.11.0",
  "networkx~=3.7",
  "scipy>=1.14",
  "pandas>=2.2",
]

[project.optional-dependencies]
# Dagster for ENV=local|aws (spec §6.4); also in dev so `make test` covers orchestration/.
orchestration = ["dagster~=1.13.25", "dagster-webserver~=1.13.25", "dagster-dbt~=0.29.25"]
dev = [
  "pytest~=9.1",
  "ruff~=0.16",
  "moto[s3,dynamodb,sqs,events]~=5.2",
  "onside-movement-demo[orchestration]",
]

[tool.setuptools.packages.find]
where = [".", "lambdas"]
include = ["generator*", "tracing*", "orchestration*", "standdown_checker*", "archiver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "lambdas"]
markers = ["integration: needs a deployed LocalStack stack; runs only with LOCALSTACK=1"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/target", "dbt/logs", "dbt/dbt_packages", "spikes", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
