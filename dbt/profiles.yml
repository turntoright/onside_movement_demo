onside_movement:
  target: sim
  outputs:
    sim:
      type: duckdb
      path: "{{ env_var('REPO_ROOT', '..') }}/warehouse/sim.duckdb"
      threads: 4
      extensions: [icu, json]
      settings:
        TimeZone: UTC
    # LocalStack S3 (spec §3.3): path-style, no TLS, LocalStack's fixed test credentials.
    local:
      type: duckdb
      path: "{{ env_var('REPO_ROOT', '..') }}/warehouse/local.duckdb"
      threads: 4
      extensions: [icu, json, httpfs]
      settings:
        TimeZone: UTC
      secrets:
        - type: s3
          key_id: test
          secret: test
          region: "{{ env_var('DBT_S3_REGION', 'ap-southeast-2') }}"
          endpoint: "{{ env_var('LOCALSTACK_S3_HOST', 'localhost:4566') }}"
          url_style: path
          use_ssl: false
    # Real AWS: the default credential chain. The region is the deployed stack's (the Makefile
    # reads it from state/<env>/outputs.json), ap-southeast-2 by default.
    aws:
      type: duckdb
      path: "{{ env_var('REPO_ROOT', '..') }}/warehouse/aws.duckdb"
      threads: 4
      extensions: [icu, json, httpfs, aws]
      settings:
        TimeZone: UTC
      secrets:
        - type: s3
          provider: credential_chain
          region: "{{ env_var('DBT_S3_REGION', 'ap-southeast-2') }}"
